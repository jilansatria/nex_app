name: nex_app
description: "NEX Project - Integrated ERP for CPO Supply Chain"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  
  # Navigation
  go_router: ^12.1.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0+1
  fl_chart: ^1.1.1
  heroicons: ^0.9.0
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.5.1
  
  # HTTP & Data
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
